name: Windows test build
on:
  push:
    branches: [ main, v1-hand-detector, v2-pose-landmarks ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout OBS 32.2.2
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-studio
          ref: 32.2.2
          path: obs-studio
          submodules: recursive
      - name: Configure OBS
        shell: pwsh
        run: cmake -S obs-studio -B obs-build -G "Visual Studio 17 2022" -A x64 -DENABLE_UI=OFF -DENABLE_PLUGINS=OFF
      - name: Build libobs
        shell: pwsh
        run: cmake --build obs-build --config Release --target libobs
      - name: Configure plugin
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE -replace '\\','/'
          $depsDir = Get-ChildItem "$env:GITHUB_WORKSPACE/obs-studio/.deps" -Directory |
            Where-Object { $_.Name -like 'obs-deps-*-x64' } |
            Select-Object -First 1
          if (-not $depsDir) { throw "OBS dependency bundle was not found" }
          $deps = $depsDir.FullName -replace '\\','/'
          Write-Host "Using OBS dependencies: $deps"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-Dlibobs_DIR=$root/obs-build/libobs" `
            "-DCMAKE_PREFIX_PATH=$deps;$root/obs-build;$root/obs-build/deps;$root/obs-build/libobs" `
            "-DCMAKE_MODULE_PATH=$root/obs-studio/cmake/finders"
      - name: Build plugin
        shell: pwsh
        run: cmake --build build --config Release
      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/obs-plugins/64bit
          Copy-Item build/Release/obs-67-counter.dll dist/obs-plugins/64bit/
      - uses: actions/upload-artifact@v4
        with:
          name: obs-67-counter-windows-x64-test
          path: dist/
